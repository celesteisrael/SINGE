services:
  # Backend Laravel (API)
  - type: web
    name: singe-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: SINGE
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: singe_db
      - key: DB_USERNAME
        value: 2TEbWH1qjlLqBxg.root
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: RUN_MIGRATIONS
        value: "false"
      - key: RUN_SEEDERS
        value: "false"

  # Frontend React (Vite SPA)
  - type: web
    name: singe-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_URL
        value: https://singe-backend.onrender.com/api
